services:
  traefik:
    image: traefik:v2.10
    container_name: traefik
    restart: unless-stopped
    command:
      - "--api.insecure=true"
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "${TRAEFIK_WEB_PORT:-80}:80"
      - "${TRAEFIK_DASHBOARD_PORT:-8088}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      mikhmon_network:
        ipv4_address: 172.27.0.4

  php_7_4:
    image: php:7.4-fpm
    container_name: php_7_4
    tty: true
    working_dir: /var/www
    volumes: 
      - .:/var/www/    
    networks: 
      mikhmon_network:
        ipv4_address: 172.27.0.5

  nginx:
    image: nginx:alpine
    container_name: nginx
    tty: true
    volumes: 
      - .:/var/www/
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      mikhmon_network:
        ipv4_address: 172.27.0.6
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mikhmon.rule=Host(`mikhmon.local`) || Host(`localhost`) || PathPrefix(`/`)"
      - "traefik.http.routers.mikhmon.entrypoints=web"
      - "traefik.http.services.mikhmon.loadbalancer.server.port=80"

  routeros:
    image: evilfreelancer/docker-routeros
    container_name: mikrotik_test
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    ports:
      - "8728:8728"
      - "8729:8729"
      - "8081:80"
    networks:
      mikhmon_network:
        ipv4_address: 172.27.0.7
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.routeros.rule=Host(`routeros.local`)"
      - "traefik.http.routers.routeros.entrypoints=web"
      - "traefik.http.services.routeros.loadbalancer.server.port=80"

networks: 
  mikhmon_network:
    driver: bridge
    ipam: 
      driver: default
      config: 
        - subnet: 172.27.0.0/24
