; Mikhmon PHP runtime tuning.
; Copied to /usr/local/etc/php/conf.d/zz-mikhmon.ini (loaded last, wins).

; --- execution / input ---
max_execution_time = 300
max_input_time = 300

; --- memory & uploads (logo upload under img/) ---
memory_limit = 256M
post_max_size = 16M
upload_max_filesize = 16M

; --- timezone ---
date.timezone = Asia/Jakarta

; --- sessions ---
session.gc_maxlifetime = 86400

; --- errors: keep the UI clean in production ---
display_errors = Off
error_reporting = E_ALL & ~E_DEPRECATED & ~E_NOTICE

; --- OPcache ---
; validate_timestamps MUST stay on: Mikhmon rewrites voucher/temp.php on every
; generation and the voucher editor rewrites templates under voucher/*.php.
; With timestamp validation off, those edits would never be picked up.
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.interned_strings_buffer = 16

; --- filesystem ---
realpath_cache_size = 4096k
