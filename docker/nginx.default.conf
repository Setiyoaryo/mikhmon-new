server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /var/www;
    index index.php index.html;
    client_max_body_size 16m;

    # Everything below is plain text or JSON, and was being sent uncompressed.
    # A page pulls in theme CSS, font-awesome, jQuery, pace and the app JS,
    # which came to ~460 KB raw and ~90 KB gzipped.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;
    # Serve a pre-compressed .gz next to the file when one exists.
    gzip_static on;

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        # 600s so a 5000 voucher batch has room, matching PHP max_execution_time.
        fastcgi_read_timeout 600;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        # Never let a browser cache rendered HTML.
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Static assets are versioned by Mikhmon itself (js/mikhmon.js?t=...) or
    # only change on an upgrade, so let the browser keep them instead of
    # revalidating every file on every navigation. Hard refresh after an
    # upgrade if a theme looks stale.
    location ~* \.(?:css|js)$ {
        expires 1d;
        access_log off;
        add_header Cache-Control "public";
    }

    location ~* \.(?:png|jpe?g|gif|ico|svg|woff2?|ttf|otf|eot)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
}
