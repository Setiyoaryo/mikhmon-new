# Production stack for the VPS, behind the EXISTING external Traefik network.
#   docker compose -f docker-compose.vps.yml up -d --build
#
# mikhmon-php : nginx + php-fpm (original PHP UI) — public via Traefik.
# mikhmon-api : Go microservice on the internal network only — NOT public.

services:
  mikhmon-php:
    build:
      context: .
      dockerfile: Dockerfile.php
    container_name: mikhmon-php
    restart: unless-stopped
    volumes:
      # Bind mount: the host repo is the source of truth and include/config.php,
      # generated vouchers, themes/lang and uploaded logos persist on the host.
      - ./:/var/www
      - ./docker/nginx.default.conf:/etc/nginx/http.d/default.conf:ro
    environment:
      MIKHMON_API_URL: "http://mikhmon-api:8088"
      # Alamat portal langganan. Panel membacanya dari sini lalu mendaftarkan
      # dirinya sendiri - tidak ada berkas yang perlu diisi tangan di VPS ini.
      MIKHMON_PORTAL_URL: "${PORTAL_BASE_URL:-https://control.nocify.id}"
      # Berapa detik daftar user hotspot boleh dipakai ulang sebelum diambil
      # lagi dari router (lihat include/hscache.php). Setel di .env kalau
      # daftarnya terlalu sering terasa lambat. 0 = selalu ambil dari router.
      MIKHMON_HSCACHE_TTL: "${HSCACHE_TTL:-300}"
    depends_on:
      - mikhmon-api
    networks:
      - proxy
      - mikhmon-internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      # Panel melayani subdomain pelanggan: tiap pelanggan dapat
      # <nama>.nocify.id, dan sesi routernya ditentukan dari subdomain
      # (include/tenant.php).
      #
      # Router "mikhmon" sengaja memakai nama eksplisit, dan wildcard-nya
      # ditaruh di router TERPISAH ("mikhmon-tenant"). Kalau sintaks wildcard
      # tidak cocok dengan versi Traefik di VPS ini, Traefik hanya menolak
      # router wildcard-nya saja - panel utama tetap hidup.
      - "traefik.http.routers.mikhmon.rule=Host(`taufiq.nocify.id`)"
      - "traefik.http.routers.mikhmon.priority=10"
      - "traefik.http.routers.mikhmon.entrypoints=websecure"
      - "traefik.http.routers.mikhmon.tls.certresolver=letsencrypt"
      - "traefik.http.routers.mikhmon.service=mikhmon"
      - "traefik.http.services.mikhmon.loadbalancer.server.port=80"
      # Semua subdomain lain. Pelanggan baru TIDAK perlu ditambahkan ke berkas
      # ini - cukup dibikin di portal, dan <nama>.nocify.id langsung jalan.
      - "traefik.http.routers.mikhmon-tenant.rule=HostRegexp(`{sub:[a-z0-9-]+}.nocify.id`)"
      - "traefik.http.routers.mikhmon-tenant.priority=5"
      - "traefik.http.routers.mikhmon-tenant.entrypoints=websecure"
      - "traefik.http.routers.mikhmon-tenant.tls.certresolver=letsencrypt"
      - "traefik.http.routers.mikhmon-tenant.service=mikhmon"
      # HTTP -> HTTPS redirect. Dua router juga, alasannya sama seperti di atas.
      - "traefik.http.routers.mikhmon-web.rule=Host(`taufiq.nocify.id`)"
      - "traefik.http.routers.mikhmon-web.priority=10"
      - "traefik.http.routers.mikhmon-web.entrypoints=web"
      - "traefik.http.routers.mikhmon-web.middlewares=mikhmon-redirect"
      - "traefik.http.routers.mikhmon-tenant-web.rule=HostRegexp(`{sub:[a-z0-9-]+}.nocify.id`)"
      - "traefik.http.routers.mikhmon-tenant-web.priority=5"
      - "traefik.http.routers.mikhmon-tenant-web.entrypoints=web"
      - "traefik.http.routers.mikhmon-tenant-web.middlewares=mikhmon-redirect"
      - "traefik.http.middlewares.mikhmon-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.mikhmon-redirect.redirectscheme.permanent=true"

  mikhmon-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mikhmon-api
    restart: unless-stopped
    environment:
      MIKHMON_API_ADDR: ":8088"
      MIKHMON_API_MAX_CONN_PER_ROUTER: "32"
      MIKHMON_API_IDLE_TIMEOUT: "600s"
    # Internal-only: no "ports:" mapping, reachable only from php-fpm.
    expose:
      - "8088"
    networks:
      - mikhmon-internal

  # Portal langganan: satu-satunya tempat yang memegang harga dan QRIS, dan
  # satu-satunya yang menentukan panel pelanggan masih aktif atau tidak.
  # Basis data SQLite disimpan di ./data/portal supaya ikut ter-backup.
  mikhmon-portal:
    build:
      context: .
      dockerfile: Dockerfile.portal
    container_name: mikhmon-portal
    restart: unless-stopped
    volumes:
      - ./data/portal:/data
    environment:
      MIKHMON_PORTAL_ADDR: ":8090"
      MIKHMON_PORTAL_DB: "/data/portal.db"
      MIKHMON_PORTAL_QRIS_IMAGE: "/data/qris.png"
      MIKHMON_PORTAL_BASE_URL: "${PORTAL_BASE_URL:-https://control.nocify.id}"
      MIKHMON_PORTAL_ADMIN_USER: "${PORTAL_ADMIN_USER:-admin}"
      MIKHMON_PORTAL_ADMIN_PASSWORD: "${PORTAL_ADMIN_PASSWORD}"
      MIKHMON_PORTAL_SECURE_COOKIE: "true"
      MIKHMON_PORTAL_QRIS_MERCHANT: "${PORTAL_QRIS_MERCHANT:-NOCIFY, SOFTWARE}"
      MIKHMON_PORTAL_QRIS_NMID: "${PORTAL_QRIS_NMID:-ID1026599320839}"
      MIKHMON_PORTAL_WA: "${PORTAL_WA:-6285139495106}"
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.portal.rule=Host(`control.nocify.id`)"
      # Lebih tinggi daripada panel, supaya control.nocify.id tidak ikut
      # tertangkap aturan wildcard *.nocify.id milik panel.
      - "traefik.http.routers.portal.priority=100"
      - "traefik.http.routers.portal.entrypoints=websecure"
      - "traefik.http.routers.portal.tls.certresolver=letsencrypt"
      - "traefik.http.routers.portal.service=portal"
      - "traefik.http.services.portal.loadbalancer.server.port=8090"
      - "traefik.http.routers.portal-web.rule=Host(`control.nocify.id`)"
      - "traefik.http.routers.portal-web.entrypoints=web"
      - "traefik.http.routers.portal-web.middlewares=portal-redirect"
      - "traefik.http.middlewares.portal-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.portal-redirect.redirectscheme.permanent=true"

networks:
  proxy:
    external: true
  mikhmon-internal:
    driver: bridge
