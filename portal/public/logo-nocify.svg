<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100" role="img" aria-label="NOCIFY">
  <title>NOCIFY</title>
  <!--
    Logo NOCIFY: dua bentuk menyilang, biru tua + biru muda, dengan bagian
    tumpang tindih yang jadi biru navy. Varian ini untuk latar terang.

    Kalau Anda punya berkas logo aslinya, cukup timpa berkas ini
    (ukuran 300x100, tanda di kiri, tulisan di kanan).
  -->
  <g style="isolation:isolate">
    <path fill="#7fbde9" d="M50 0 H100 L50 100 H0 Z" />
    <path fill="#2b57b0" style="mix-blend-mode:multiply" d="M0 0 H50 L100 100 H50 Z" />
  </g>
  <text
    x="120"
    y="67"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
    font-size="56"
    font-weight="600"
    letter-spacing="-1.6"
    fill="#1b3a63">nocify</text>
</svg>
